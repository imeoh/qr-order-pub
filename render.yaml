
services:
  - type: web
    name: qr-order-pub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TABLE_COUNT
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: qr-order-db
          property: connectionString

databases:
  - name: qr-order-db
