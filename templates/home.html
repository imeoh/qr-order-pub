
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학 주점 QR 오더</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:24px}
.wrap{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:18px}
a{display:block;padding:14px;margin:8px 0;background:#111;color:#fff;text-decoration:none;border-radius:12px;text-align:center}
small{color:#666}
</style>
</head>
<body>
<div class="wrap">
<h1>🍻 대학 주점 QR 오더</h1>
<p>손님은 테이블에 붙어있는 QR을 스캔해서 주문해주세요.</p>
<small>테스트용 테이블 선택</small>
{% for t in range(1, table_count + 1) %}
<a href="/t/{{ t }}">{{ t }}번 테이블</a>
{% endfor %}
</div>
</body>
</html>
