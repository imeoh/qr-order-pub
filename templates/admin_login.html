
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 로그인</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:30px}
.box{max-width:400px;margin:10vh auto;background:#fff;padding:24px;border-radius:18px}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:12px;font-size:16px}
input{border:1px solid #ccc}button{border:0;background:#111;color:#fff;font-weight:bold}
.err{color:#c00}
</style>
</head>
<body>
<div class="box">
<h1>관리자</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form action="/admin/login" method="post">
<input type="password" name="pw" placeholder="관리자 비밀번호">
<button>로그인</button>
</form>
</div>
</body>
</html>
